<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Developer Tools / Asset Lab</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:#172033; background:#eef2f6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; }
    header { padding:32px 20px 18px; max-width:1100px; margin:auto; }
    h1 { margin:0 0 8px; font-size:clamp(28px,5vw,46px); }
    p { color:#526079; }
    main { max-width:1100px; margin:auto; padding:0 20px 40px; display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
    .tool { background:white; border:1px solid #d9e0e8; border-radius:16px; padding:18px; min-height:170px; box-shadow:0 8px 24px rgba(0,0,0,.05); }
    .tool h2 { margin:0 0 8px; font-size:20px; }
    .status { display:inline-block; margin-top:12px; padding:5px 9px; border-radius:999px; background:#edf1f5; color:#566273; font-size:12px; font-weight:700; }
    footer { max-width:1100px; margin:auto; padding:0 20px 36px; color:#6a7688; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <h1>Developer Tools / Asset Lab</h1>
    <p>Zentrale webbasierte Entwickler-Toolbox für unsere Spiele- und Softwareprojekte.</p>
  </header>
  <main id="toolGrid"></main>
  <footer>Der frühere Hallen-Prototyp ist auf <code>archive/baustellenplaner-halle-legacy</code> gesichert.</footer>
  <script type="module" src="main.js?v=df04a-testbuild1"></script>
</body>
</html>
