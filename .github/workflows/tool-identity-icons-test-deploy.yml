name: Temporary Tool Identity Icons Test Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Tool Identity Icons implementation
        uses: actions/checkout@v4
        with:
          ref: e6590589eeef5e92a170dc11d9b9ea413a2d7056
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload exact test artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy exact test artifact
        id: deployment
        uses: actions/deploy-pages@v4
