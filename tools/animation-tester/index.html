<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animation Tester</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#10151d;color:#eef3f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr}header{padding:14px 18px;border-bottom:1px solid #2b3542;background:#151c26;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:18px;margin:0}.badge{font-size:11px;padding:3px 8px;border:1px solid #4ea1ff;border-radius:999px;color:#4ea1ff}main{display:grid;grid-template-columns:340px 1fr;min-height:0}.panel{padding:12px;border-right:1px solid #2b3542;overflow:auto;background:#111821}fieldset{border:1px solid #303b49;border-radius:8px;margin:0 0 10px;padding:9px}legend{font-size:11px;color:#9faec1;padding:0 5px}label{font-size:11px;color:#aeb9c8;display:block;margin:5px 0 3px}input,select,button{width:100%;background:#1a2430;color:#eef3f8;border:1px solid #394655;border-radius:5px;padding:7px}input[type=checkbox]{width:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}.checks label{display:flex;align-items:center;gap:6px;margin:0}.buttons{display:flex;gap:7px}.buttons button{cursor:pointer}.stageWrap{min-width:0;min-height:0;display:flex;flex-direction:column;padding:12px}.stage{position:relative;flex:1;min-height:300px;border:1px solid #303b49;border-radius:10px;overflow:hidden;background-color:#0b1017;background-image:linear-gradient(45deg,#131b25 25%,transparent 25%),linear-gradient(-45deg,#131b25 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#131b25 75%),linear-gradient(-45deg,transparent 75%,#131b25 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.status{padding:7px 2px;font-size:12px;color:#9faec1;display:flex;justify-content:space-between;gap:10px}@media(max-width:850px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}.panel{border-right:0;border-bottom:1px solid #2b3542;max-height:48vh}.stageWrap{min-height:52vh}}
</style>
</head>
<body>
<header><h1>Animation Tester</h1><span class="badge">Standalone V1</span></header>
<main>
<section class="panel">
<fieldset><legend>Dateien</legend><label>PNG / Sprite-Sheet</label><input id="imgFile" type="file" accept="image/*"><label>Atlas-JSON</label><input id="jsonFile" type="file" accept="application/json,.json"><div id="fileInfo" style="font-size:11px;color:#8fa0b4;margin-top:6px">Noch keine Dateien geladen.</div></fieldset>
<fieldset><legend>Frames / Animation</legend><label>Namensfilter / Sequenz</label><input id="filter" placeholder="z. B. walk_s oder tree"><label>Startframe</label><select id="frameSelect"></select><div class="row"><div><label>FPS</label><input id="fps" type="number" min="1" max="60" value="6"></div><div><label>Zoom</label><input id="zoom" type="number" min="0.1" max="8" step="0.1" value="1"></div></div><div class="checks" style="margin-top:8px"><label><input id="loop" type="checkbox" checked> Loop</label><label><input id="pingpong" type="checkbox"> Ping-Pong</label></div><div class="buttons" style="margin-top:8px"><button id="play">▶ Start</button><button id="stop">■ Stop</button></div></fieldset>
<fieldset><legend>Bewegungstest</legend><label>Pfad</label><select id="path"><option value="none">Keine Bewegung</option><option value="line">Linie</option><option value="circle">Kreis</option><option value="box">Rechteck</option></select><div class="row"><div><label>Tempo px/s</label><input id="speed" type="number" min="0" max="1000" value="100"></div><div><label>Richtung</label><select id="direction"><option>Auto</option><option>N</option><option>NE</option><option>E</option><option>SE</option><option>S</option><option>SW</option><option>W</option><option>NW</option></select></div></div></fieldset>
<fieldset><legend>Debug-Overlays</legend><div class="checks"><label><input id="grid" type="checkbox"> Grid</label><label><input id="bbox" type="checkbox" checked> Bounding Box</label><label><input id="pivot" type="checkbox" checked> Pivot/Anchor</label><label><input id="foot" type="checkbox" checked> Fußlinie</label><label><input id="trail" type="checkbox"> Trail</label><label><input id="smooth" type="checkbox"> Glätten</label></div></fieldset>
</section>
<section class="stageWrap"><div class="stage"><canvas id="canvas"></canvas></div><div class="status"><span id="statusLeft">Bereit</span><span id="statusRight">0 Frames</span></div></section>
</main>
<script>
const $=id=>document.getElementById(id);const c=$('canvas'),ctx=c.getContext('2d');let image=null,frames=[],seq=[],idx=0,playing=false,last=0,acc=0,dir=1,pathT=0,trailPts=[];
function normalizeAtlas(data){const out=[];const src=data.frames??data;const push=(name,v)=>{const f=v.frame??v;const x=+f.x||0,y=+f.y||0,w=+(f.w??f.width)||0,h=+(f.h??f.height)||0;if(!w||!h)return;let ax=.5,ay=1;const a=v.anchor??v.pivot??v.meta?.anchor;if(a){ax=+(a.x??a[0]??ax);ay=+(a.y??a[1]??ay)}if(ax>1||ay>1){ax=ax/w;ay=ay/h}out.push({name:String(name),x,y,w,h,ax,ay,scale:+v.scale||1})};if(Array.isArray(src)){src.forEach((v,i)=>push(v.filename??v.name??i,v))}else if(src&&typeof src==='object'){Object.entries(src).forEach(([k,v])=>push(k,v))}return out}
function rebuildSeq(){const q=$('filter').value.trim().toLowerCase();seq=frames.filter(f=>!q||f.name.toLowerCase().includes(q));if(!seq.length)seq=frames.slice();idx=Math.min(idx,Math.max(0,seq.length-1));$('frameSelect').innerHTML=seq.map((f,i)=>`<option value="${i}">${f.name}</option>`).join('');$('frameSelect').value=String(idx);$('statusRight').textContent=`${seq.length} / ${frames.length} Frames`;draw()}
$('imgFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const im=new Image;im.onload=()=>{image=im;$('fileInfo').textContent=`Bild: ${f.name} · ${im.width}×${im.height}px`;draw()};im.src=URL.createObjectURL(f)});
$('jsonFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{frames=normalizeAtlas(JSON.parse(await f.text()));idx=0;rebuildSeq();$('fileInfo').textContent+=` · Atlas: ${f.name} (${frames.length} Frames)`}catch(err){$('statusLeft').textContent='JSON konnte nicht gelesen werden.'}});
$('filter').addEventListener('input',rebuildSeq);$('frameSelect').addEventListener('change',()=>{idx=+$('frameSelect').value;draw()});['zoom','grid','bbox','pivot','foot','trail','smooth','path','direction'].forEach(id=>$(id).addEventListener('input',draw));$('play').onclick=()=>{playing=true;last=performance.now();requestAnimationFrame(tick)};$('stop').onclick=()=>{playing=false;draw()};
function sizeCanvas(){const r=c.parentElement.getBoundingClientRect(),dpr=devicePixelRatio||1;const w=Math.max(10,Math.floor(r.width)),h=Math.max(10,Math.floor(r.height));if(c.width!==Math.floor(w*dpr)||c.height!==Math.floor(h*dpr)){c.width=Math.floor(w*dpr);c.height=Math.floor(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}return{w,h}}
function pointOnPath(t,w,h){const pad=Math.min(w,h)*.18,cx=w/2,cy=h/2,rx=Math.max(20,w/2-pad),ry=Math.max(20,h/2-pad);const p=$('path').value;if(p==='line')return{x:pad+(w-2*pad)*((Math.sin(t)+1)/2),y:cy};if(p==='circle')return{x:cx+Math.cos(t)*rx*.55,y:cy+Math.sin(t)*ry*.55};if(p==='box'){const u=((t/(Math.PI*2))%1+1)%1*4;if(u<1)return{x:pad+(w-2*pad)*u,y:pad};if(u<2)return{x:w-pad,y:pad+(h-2*pad)*(u-1)};if(u<3)return{x:w-pad-(w-2*pad)*(u-2),y:h-pad};return{x:pad,y:h-pad-(h-2*pad)*(u-3)}}return{x:cx,y:cy}}
function drawGrid(w,h){ctx.save();ctx.strokeStyle='rgba(78,161,255,.18)';ctx.lineWidth=1;for(let x=0;x<w;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.restore()}
function draw(){const {w,h}=sizeCanvas();ctx.clearRect(0,0,w,h);ctx.imageSmoothingEnabled=$('smooth').checked;if($('grid').checked)drawGrid(w,h);if(!image||!seq.length){ctx.fillStyle='#8fa0b4';ctx.font='14px system-ui';ctx.fillText('PNG und Atlas-JSON laden',24,34);return}const f=seq[idx]||seq[0],z=Math.max(.1,+$('zoom').value||1),sc=z*(f.scale||1),dw=f.w*sc,dh=f.h*sc,p=pointOnPath(pathT,w,h),dx=p.x-dw*f.ax,dy=p.y-dh*f.ay;ctx.drawImage(image,f.x,f.y,f.w,f.h,dx,dy,dw,dh);if($('bbox').checked){ctx.strokeStyle='#55d6ff';ctx.lineWidth=1;ctx.strokeRect(dx+.5,dy+.5,dw-1,dh-1)}if($('pivot').checked){ctx.strokeStyle='#ffcf5c';ctx.beginPath();ctx.moveTo(p.x-8,p.y);ctx.lineTo(p.x+8,p.y);ctx.moveTo(p.x,p.y-8);ctx.lineTo(p.x,p.y+8);ctx.stroke()}if($('foot').checked){ctx.strokeStyle='#72e39a';ctx.beginPath();ctx.moveTo(p.x-dw*.35,p.y+.5);ctx.lineTo(p.x+dw*.35,p.y+.5);ctx.stroke()}if($('trail').checked&&trailPts.length>1){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.beginPath();trailPts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke()}$('statusLeft').textContent=`${f.name} · Frame ${idx+1}/${seq.length} · Richtung ${$('direction').value}`}
function tick(t){if(!playing)return;const dt=Math.min(.1,(t-last)/1000||0);last=t;acc+=dt;const fps=Math.max(1,+$('fps').value||6),step=1/fps;if(acc>=step&&seq.length){acc%=step;if($('pingpong').checked){idx+=dir;if(idx>=seq.length-1){idx=seq.length-1;dir=-1}else if(idx<=0){idx=0;dir=1}}else{idx++;if(idx>=seq.length){if($('loop').checked)idx=0;else{idx=seq.length-1;playing=false}}}$('frameSelect').value=String(idx)}const speed=Math.max(0,+$('speed').value||0);pathT+=dt*speed/80;const {w,h}=sizeCanvas(),p=pointOnPath(pathT,w,h);if($('trail').checked){trailPts.push(p);if(trailPts.length>160)trailPts.shift()}else trailPts=[];draw();if(playing)requestAnimationFrame(tick)}
new ResizeObserver(draw).observe(c.parentElement);rebuildSeq();
</script>
</body>
</html>
