<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sprite Lab / Atlas Builder</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eef4ff;background:#0d1117}
    *{box-sizing:border-box} body{margin:0;height:100vh;display:grid;grid-template-rows:auto 1fr}
    header{padding:10px 14px;border-bottom:1px solid #263140;background:#121923;display:flex;gap:12px;align-items:center;justify-content:space-between}
    h1{font-size:17px;margin:0}.muted{color:#9ba9bb;font-size:12px}
    main{min-height:0;display:grid;grid-template-columns:330px 1fr}
    aside{padding:12px;overflow:auto;border-right:1px solid #263140;background:#101722}
    section{border:1px solid #263140;border-radius:10px;padding:10px;margin-bottom:10px;background:#151e2a}
    section h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#a9b5c6;margin:0 0 8px}
    label{display:block;font-size:11px;color:#a9b5c6;margin:6px 0 3px}
    input,select,button,textarea{width:100%;background:#0d141d;color:#edf5ff;border:1px solid #334154;border-radius:6px;padding:7px;font:inherit;font-size:12px}
    button{cursor:pointer;background:#1c2a3a}.primary{background:#1f6feb;border-color:#388bfd}.danger{color:#ff8585}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
    #frames{max-height:170px;overflow:auto;border:1px solid #2b3747;border-radius:6px}
    .frame{padding:6px;border-bottom:1px solid #273243;cursor:pointer;font-size:11px}.frame:last-child{border:0}.frame.active{background:#17345a}
    .viewer{min-width:0;min-height:0;padding:12px;display:flex;flex-direction:column;gap:8px}
    .canvasWrap{flex:1;min-height:250px;overflow:auto;border:1px solid #263140;border-radius:10px;background-color:#111820;background-image:linear-gradient(45deg,#171f2a 25%,transparent 25%),linear-gradient(-45deg,#171f2a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#171f2a 75%),linear-gradient(-45deg,transparent 75%,#171f2a 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
    canvas{display:block;image-rendering:auto;cursor:crosshair}
    .toolbar{display:flex;gap:8px;align-items:center}.toolbar>*{width:auto}.status{font-size:12px;color:#9ba9bb;margin-left:auto}
    @media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:minmax(260px,46vh) 1fr}aside{border-right:0;border-bottom:1px solid #263140}.viewer{min-height:0}}
  </style>
</head>
<body>
<header><div><h1>Sprite Lab / Atlas Builder</h1><div class="muted">Konsolidierte Standalone-Version aus den Siedler-Asset-Werkzeugen</div></div><a href="../../" class="muted">← Tool Hub</a></header>
<main>
<aside>
  <section><h2>Dateien</h2><label>PNG / Sprite-Sheet</label><input id="imageInput" type="file" accept="image/*"><label>Atlas JSON (optional)</label><input id="jsonInput" type="file" accept="application/json,.json"><div id="imageInfo" class="muted">Kein Bild geladen.</div></section>
  <section><h2>Interaktion</h2><label>Modus</label><select id="mode"><option value="select">Auswählen</option><option value="draw">Frame zeichnen</option><option value="anchor">Anchor setzen</option></select><label>Zoom</label><input id="zoom" type="range" min="0.1" max="3" step="0.1" value="1"></section>
  <section><h2>Frames</h2><div id="frames"></div><button id="addFrame">Leeren Frame anlegen</button><button id="deleteFrame" class="danger">Ausgewählten Frame löschen</button></section>
  <section><h2>Aktueller Frame</h2><label>Name</label><input id="name"><div class="row4"><div><label>X</label><input id="x" type="number"></div><div><label>Y</label><input id="y" type="number"></div><div><label>W</label><input id="w" type="number"></div><div><label>H</label><input id="h" type="number"></div></div><div class="row"><div><label>Anchor X</label><input id="ax" type="number" step="0.01"></div><div><label>Anchor Y</label><input id="ay" type="number" step="0.01"></div></div><label>Scale</label><input id="scale" type="number" step="0.01" value="1"></section>
  <section><h2>Export</h2><label>Texture Key</label><input id="textureKey" value="atlas"><button id="exportJson" class="primary">Atlas JSON exportieren</button><textarea id="jsonPreview" rows="8" readonly></textarea></section>
</aside>
<div class="viewer"><div class="toolbar"><button id="fit">Ansicht einpassen</button><span class="muted">Drag im Modus „Frame zeichnen“ · Klick im Modus „Anchor setzen“</span><span id="status" class="status">Bereit</span></div><div class="canvasWrap" id="canvasWrap"><canvas id="canvas"></canvas></div></div>
</main>
<script>
const $=id=>document.getElementById(id); const S={img:null,frames:[],sel:-1,zoom:1,drag:null,fileName:''};
const canvas=$('canvas'),ctx=canvas.getContext('2d');
function normalizeFrame(f,i){const r=f.frame||f;return{name:f.filename||f.name||('frame_'+String(i).padStart(3,'0')),x:+r.x||0,y:+r.y||0,w:+r.w||+r.width||32,h:+r.h||+r.height||32,anchorX:f.anchorX??f.pivot?.x??0.5,anchorY:f.anchorY??f.pivot?.y??1,scale:f.scale??1};}
function setStatus(t){$('status').textContent=t}
function renderList(){const box=$('frames');box.innerHTML='';S.frames.forEach((f,i)=>{const d=document.createElement('div');d.className='frame'+(i===S.sel?' active':'');d.textContent=`${f.name} · ${f.x},${f.y} ${f.w}×${f.h}`;d.onclick=()=>{S.sel=i;syncForm();draw();renderList()};box.appendChild(d)});syncPreview()}
function syncForm(){const f=S.frames[S.sel];['name','x','y','w','h','ax','ay','scale'].forEach(id=>$(id).disabled=!f);if(!f)return;$('name').value=f.name;$('x').value=f.x;$('y').value=f.y;$('w').value=f.w;$('h').value=f.h;$('ax').value=f.anchorX;$('ay').value=f.anchorY;$('scale').value=f.scale}
function applyForm(){const f=S.frames[S.sel];if(!f)return;f.name=$('name').value||f.name;f.x=+$('x').value||0;f.y=+$('y').value||0;f.w=Math.max(1,+$('w').value||1);f.h=Math.max(1,+$('h').value||1);f.anchorX=+$('ax').value;f.anchorY=+$('ay').value;f.scale=+$('scale').value||1;renderList();draw()}
['name','x','y','w','h','ax','ay','scale'].forEach(id=>$(id).addEventListener('input',applyForm));
function draw(){if(!S.img){canvas.width=800;canvas.height=500;ctx.clearRect(0,0,canvas.width,canvas.height);return}const z=S.zoom;canvas.width=Math.max(1,Math.round(S.img.width*z));canvas.height=Math.max(1,Math.round(S.img.height*z));ctx.imageSmoothingEnabled=false;ctx.drawImage(S.img,0,0,canvas.width,canvas.height);ctx.lineWidth=2;S.frames.forEach((f,i)=>{ctx.strokeStyle=i===S.sel?'#ffcf4a':'#35a7ff';ctx.strokeRect(f.x*z,f.y*z,f.w*z,f.h*z);const ax=(f.x+f.w*f.anchorX)*z,ay=(f.y+f.h*f.anchorY)*z;ctx.fillStyle=i===S.sel?'#ff5c5c':'#7cf29a';ctx.beginPath();ctx.arc(ax,ay,4,0,Math.PI*2);ctx.fill()});if(S.drag){const r=S.drag;ctx.strokeStyle='#ffffff';ctx.setLineDash([6,4]);ctx.strokeRect(r.x*z,r.y*z,r.w*z,r.h*z);ctx.setLineDash([])}}
function point(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)/S.zoom,y:(ev.clientY-r.top)/S.zoom}}
canvas.addEventListener('pointerdown',e=>{if(!S.img)return;const p=point(e),m=$('mode').value;if(m==='draw'){S.drag={sx:p.x,sy:p.y,x:p.x,y:p.y,w:0,h:0};canvas.setPointerCapture(e.pointerId)}else if(m==='anchor'&&S.sel>=0){const f=S.frames[S.sel];f.anchorX=Math.max(0,Math.min(1,(p.x-f.x)/f.w));f.anchorY=Math.max(0,Math.min(1,(p.y-f.y)/f.h));syncForm();draw();syncPreview()}else{for(let i=S.frames.length-1;i>=0;i--){const f=S.frames[i];if(p.x>=f.x&&p.x<=f.x+f.w&&p.y>=f.y&&p.y<=f.y+f.h){S.sel=i;syncForm();renderList();draw();break}}}});
canvas.addEventListener('pointermove',e=>{if(!S.drag)return;const p=point(e),d=S.drag;d.x=Math.min(d.sx,p.x);d.y=Math.min(d.sy,p.y);d.w=Math.abs(p.x-d.sx);d.h=Math.abs(p.y-d.sy);draw()});
canvas.addEventListener('pointerup',()=>{if(!S.drag)return;const d=S.drag;S.drag=null;if(d.w>=2&&d.h>=2){S.frames.push({name:'frame_'+String(S.frames.length).padStart(3,'0'),x:Math.round(d.x),y:Math.round(d.y),w:Math.round(d.w),h:Math.round(d.h),anchorX:.5,anchorY:1,scale:1});S.sel=S.frames.length-1;renderList();syncForm()}draw()});
$('imageInput').onchange=e=>{const file=e.target.files[0];if(!file)return;const img=new Image;img.onload=()=>{S.img=img;S.fileName=file.name;S.zoom=1;$('zoom').value=1;$('imageInfo').textContent=`${file.name} · ${img.width}×${img.height}`;setStatus('Bild geladen');draw()};img.src=URL.createObjectURL(file)};
$('jsonInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const j=JSON.parse(await file.text());let raw=j.frames||j;let arr=Array.isArray(raw)?raw:Object.entries(raw).map(([name,v])=>({name,...v}));S.frames=arr.map(normalizeFrame);S.sel=S.frames.length?0:-1;$('textureKey').value=j.meta?.textureKey||j.meta?.image||$('textureKey').value;renderList();syncForm();setStatus(`${S.frames.length} Frames importiert`)}catch(err){alert('JSON konnte nicht gelesen werden: '+err.message)}};
$('zoom').oninput=e=>{S.zoom=+e.target.value;draw()};$('fit').onclick=()=>{if(!S.img)return;const wrap=$('canvasWrap');S.zoom=Math.min(1,(wrap.clientWidth-20)/S.img.width,(wrap.clientHeight-20)/S.img.height);S.zoom=Math.max(.1,S.zoom);$('zoom').value=S.zoom;draw()};
$('addFrame').onclick=()=>{S.frames.push({name:'frame_'+String(S.frames.length).padStart(3,'0'),x:0,y:0,w:32,h:32,anchorX:.5,anchorY:1,scale:1});S.sel=S.frames.length-1;renderList();syncForm();draw()};
$('deleteFrame').onclick=()=>{if(S.sel<0)return;S.frames.splice(S.sel,1);S.sel=Math.min(S.sel,S.frames.length-1);renderList();syncForm();draw()};
function exportObject(){const frames={};S.frames.forEach(f=>frames[f.name]={frame:{x:f.x,y:f.y,w:f.w,h:f.h},anchorX:f.anchorX,anchorY:f.anchorY,scale:f.scale});return{meta:{format:'asset-lab-atlas-v1',image:S.fileName||null,textureKey:$('textureKey').value||'atlas',generated:new Date().toISOString()},frames}}
function syncPreview(){$('jsonPreview').value=JSON.stringify(exportObject(),null,2)}
$('exportJson').onclick=()=>{const text=JSON.stringify(exportObject(),null,2),blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=($('textureKey').value||'atlas')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
renderList();draw();
</script>
</body></html>
